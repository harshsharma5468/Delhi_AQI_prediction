name: Hourly AQI Fetch and Forecast Training

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'aqi_calculator.py'
      - 'train_forecaster.py'
      - '.github/workflows/hourly_fetch.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_train_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch one Delhi observation
        run: python fetch_api.py
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Train time-based one-hour forecast
        run: python train_forecaster.py
        # Training needs enough consecutive observations. Data collection still succeeds if it is not ready.
        continue-on-error: true

      - name: Commit refreshed data and forecast model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqi_data.csv
          git add -f models/aqi_forecaster.pkl models/aqi_forecaster.json
          git diff --cached --quiet || git commit -m "chore: refresh AQI data and forecast model"
          git push
